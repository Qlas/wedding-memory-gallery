
[workspace]
members = ["crates/app", "crates/entity", "crates/migration"]
resolver = "3"
default-members = ["crates/app"]


[workspace.dependencies]
sea-orm = { version = "1.1.12", features = [
  "macros",
  "runtime-tokio",
  "sqlx-sqlite",
  "debug-print",
] }
serde = { version = "1.0.219", features = ["derive"] }
