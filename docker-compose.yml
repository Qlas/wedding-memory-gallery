include:
  - backend/docker-compose.yml
  - frontend/docker-compose.yml

services:
  caddy:
      image: caddy:2.10.0
      ports:
        - 80:80
      volumes:
        - caddy_data:/data
        - caddy_config:/config
        - ./Caddyfile:/etc/caddy/Caddyfile
      depends_on:
        - frontend
        - backend

volumes:
  caddy_data:
  caddy_config:

